name: 🎉 新機能の提案 (Feature Request)
description: アプリへの新しい機能や改善のアイデアを提案します
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        新機能や改善のアイデアをご提案いただきありがとうございます！

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / 背景
      description: どのような課題や不便さがあり、この機能が必要だと感じたかを記載してください。
      placeholder: 現在の仕様では◯◯の確認に時間がかかる...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する機能の内容
      description: どのような機能や変更を希望するか記載してください。
      placeholder: メイン画面に◯◯を表示するボタンを追加してほしい。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他に考えられる解決策があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足情報 / 参考リンク
      description: 参考となる他のアプリの事例やスクリーンショットなどがあれば記載してください。
    validations:
      required: false
