# GitHub Automatically Generated Release Notes Configuration
# https://docs.github.com/ja/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - 'duplicate'
      - 'invalid'
      - 'wontfix'
      - 'skip-changelog'
    authors:
      - 'dependabot[bot]'

  categories:
    - title: '🎉 新機能 (New Features)'
      labels:
        - 'feature'
        - 'enhancement'

    - title: '🐛 バグ修正 (Bug Fixes)'
      labels:
        - 'fix'
        - 'bug'

    - title: '🎨 UI/UX 改善 (UI & UX Improvements)'
      labels:
        - 'ui'
        - 'ux'
        - 'style'

    - title: '⚡ パフォーマンス・内部改善 (Performance & Refactoring)'
      labels:
        - 'performance'
        - 'refactor'
        - 'internal'

    - title: '📝 開発・ドキュメント・その他 (Chore & Maintenance)'
      labels:
        - 'documentation'
        - 'maintenance'
        - 'chore'
        - 'dependencies'
